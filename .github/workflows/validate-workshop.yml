name: Validate workshop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate artifacts and documentation
        run: python3 scripts/validate.py
      - name: Verify the scoped deletion guard
        run: python3 -m unittest discover -s tests -v
      - name: Compile Python and check shell syntax
        run: |
          python3 -m compileall -q scripts
          bash -n scripts/install.sh scripts/apiops.sh
