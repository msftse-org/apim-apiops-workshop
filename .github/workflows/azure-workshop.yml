name: Azure workshop
on:
  workflow_dispatch:
    inputs:
      action:
        description: Preview or publish the development baseline
        required: true
        default: preview
        type: choice
        options: [preview, publish]
permissions:
  contents: read
  id-token: write
concurrency:
  group: apim-workshop-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Write local configuration
        env:
          WORKSHOP_SUB: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          WORKSHOP_RG: ${{ vars.APIM_RESOURCE_GROUP }}
          WORKSHOP_APIM: ${{ vars.APIM_SERVICE_NAME }}
          WORKSHOP_APIC: ${{ vars.APIC_SERVICE_NAME }}
          WORKSHOP_LOCATION: ${{ vars.AZURE_LOCATION }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          keys = {'subscriptionId':'WORKSHOP_SUB','resourceGroup':'WORKSHOP_RG','apim':'WORKSHOP_APIM','apic':'WORKSHOP_APIC','location':'WORKSHOP_LOCATION'}
          data = {k:os.environ[v] for k,v in keys.items()}
          assert all(data.values()), 'Configure all workshop repository variables first'
          Path('config.local.json').write_text(json.dumps(data))
          PY
      - name: Install the pinned CLI
        run: bash scripts/install.sh
      - name: Run the selected exercise
        env:
          WORKSHOP_ACTION: ${{ inputs.action }}
        run: python3 scripts/workshop.py "$WORKSHOP_ACTION" --env dev
      - name: Verify development response
        if: inputs.action == 'publish'
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from workshop import Workshop
          Workshop().smoke('dev', 'v1')
          PY
      - name: Save run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apim-workshop-${{ inputs.action }}
          path: |
            .work/validation.json
            .work/logs/*.stdout.txt
            .work/logs/*.stderr.txt
          include-hidden-files: true
          retention-days: 7
